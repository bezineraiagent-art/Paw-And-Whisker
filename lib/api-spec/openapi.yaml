openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /vet-reviewer-applications:
    post:
      operationId: submitVetReviewerApplication
      summary: Apply to review educational pet guides; nothing publishes automatically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VetReviewerApplicationInput"
      responses:
        "201":
          description: Application saved for manual review; no email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReceipt"
        "400":
          description: Invalid input or missing consent
        "429":
          description: Too many applications
        "503":
          description: Storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: joinPlusWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Saved to the coming-soon email waitlist, no paid access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReceipt"
  /answer-reports:
    post:
      operationId: reportWrongAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerReportInput"
      responses:
        "201":
          description: Report saved for manual review, no email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionReceipt"
  /subscribers:
    post:
      operationId: capturePdfEmail
      summary: Save an email and unlock the free symptom PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Email saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfAccess"
        "400":
          description: Invalid email
        "500":
          description: Storage unavailable
  /companion/usage:
    get:
      operationId: getCompanionUsage
      summary: Get anonymous daily chat allowance
      responses:
        "200":
          description: Current allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionUsage"
  /companion/message:
    post:
      operationId: askCompanion
      summary: Ask a general pet question within the daily allowance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionInput"
      responses:
        "200":
          description: Answer and remaining allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionAnswer"
        "400":
          description: Invalid question
        "429":
          description: Daily cap reached
        "503":
          description: AI unavailable
  /vets/search:
    post:
      operationId: searchVets
      summary: Find nearby clinics without persisting a visitor location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VetSearchInput"
      responses:
        "200":
          description: Distance-sorted nearby clinics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VetSearchResult"
        "400":
          description: Invalid search
        "429":
          description: Rate limited
        "503":
          description: Public map service unavailable
  /promotion/clinic-applications:
    post:
      operationId: createClinicApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicApplicationInput"
      responses:
        "201":
          description: Application saved, not published or emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionReceipt"
  /promotion/advertiser-inquiries:
    post:
      operationId: createAdvertiserInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertiserInquiryInput"
      responses:
        "201":
          description: Inquiry saved, no outbound messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionReceipt"
  /promotion/leads:
    get:
      operationId: getPromotionLeads
      parameters:
        - in: header
          name: x-admin-token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest 100 leads of each kind, accessible only with the existing admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionLeads"
        "401":
          description: Unauthorized
  /admin/waitlist:
    get:
      operationId: getAdminWaitlist
      parameters:
        - { in: header, name: x-admin-token, required: true, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Plus waitlist only, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWaitlistPage" }
        "400": { description: Invalid pagination }
        "401": { description: Unauthorized }
        "429": { description: Rate limited }
        "503": { description: Unavailable }
  /admin/answer-reports:
    get:
      operationId: getAdminAnswerReports
      parameters:
        - { in: header, name: x-admin-token, required: true, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Answer reports, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAnswerReportsPage" }
        "400": { description: Invalid pagination }
        "401": { description: Unauthorized }
        "429": { description: Rate limited }
        "503": { description: Unavailable }
  /admin/vet-reviewer-applications:
    get:
      operationId: getAdminVetReviewerApplications
      parameters:
        - { in: header, name: x-admin-token, required: true, schema: { type: string } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Private read-only applications, newest first; not verified reviewers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVetReviewerApplicationsPage" }
        "400": { description: Invalid pagination }
        "401": { description: Unauthorized }
        "429": { description: Rate limited }
        "503": { description: Unavailable }
components:
  schemas:
    AdminVetReviewerApplication:
      allOf:
        - $ref: "#/components/schemas/AdminWaitlistRecord"
        - type: object
          required: [name, credentials, registrationBody, registrationNumber, clinic, clinicWebsite, message, consent]
          properties:
            name: { type: string }
            credentials: { type: string }
            registrationBody: { type: string }
            registrationNumber: { type: string }
            clinic: { type: ["string", "null"] }
            clinicWebsite: { type: ["string", "null"] }
            message: { type: string }
            consent: { type: boolean }
    AdminVetReviewerApplicationsPage:
      type: object
      required: [records, total, offset, limit]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/AdminVetReviewerApplication" }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    AdminWaitlistRecord:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        createdAt: { type: string, format: date-time }
    AdminAnswerReport:
      allOf:
        - $ref: "#/components/schemas/AdminWaitlistRecord"
        - type: object
          required: [message]
          properties:
            message: { type: string }
    AdminWaitlistPage:
      type: object
      required: [records, total, offset, limit]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/AdminWaitlistRecord" }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    AdminAnswerReportsPage:
      type: object
      required: [records, total, offset, limit]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/AdminAnswerReport" }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    VetReviewerApplicationInput:
      type: object
      required: [name, email, credentials, registrationBody, registrationNumber, message, consent]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        credentials: { type: string, minLength: 2, maxLength: 120 }
        registrationBody: { type: string, minLength: 2, maxLength: 180 }
        registrationNumber: { type: string, minLength: 2, maxLength: 100 }
        clinic: { type: string, maxLength: 180 }
        clinicWebsite: { type: string, maxLength: 2048 }
        message: { type: string, minLength: 10, maxLength: 3000 }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    SubmissionReceipt:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    WaitlistInput:
      type: object
      required: [email, consent]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    AnswerReportInput:
      type: object
      required: [email, message, consent]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        message: { type: string, minLength: 10, maxLength: 3000 }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    PetProfile:
      type: object
      required: [name, species, age, weight, allergies, conditions]
      properties:
        name: { type: string, maxLength: 60 }
        species: { type: string, enum: [puppy, dog, cat, other] }
        age: { type: string, maxLength: 40 }
        weight: { type: string, maxLength: 40 }
        breed: { type: string, maxLength: 100 }
        allergies: { type: string, maxLength: 300 }
        conditions: { type: string, maxLength: 300 }
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PdfAccess:
      type: object
      required: [success, downloadUrl]
      properties:
        success:
          type: boolean
        downloadUrl:
          type: string
    CompanionInput:
      type: object
      required: [question]
      properties:
        pet: { $ref: "#/components/schemas/PetProfile" }
        imageDataUrl:
          type: string
          maxLength: 4500000
          description: Optional transient JPEG, PNG or WebP, never persisted in the app database
        question:
          type: string
          minLength: 1
          maxLength: 3000
        petName:
          type: string
          maxLength: 60
        species:
          type: string
          enum: [puppy, dog, cat]
        age:
          type: string
          maxLength: 40
    CompanionUsage:
      type: object
      required: [remaining, limit, resetsAt]
      properties:
        remaining:
          type: integer
        limit:
          type: integer
        resetsAt:
          type: string
          format: date-time
    CompanionAnswer:
      type: object
      required: [answer, urgency, remaining, limit, resetsAt]
      properties:
        urgency:
          type: string
          enum: [monitor, today, urgent, emergency]
        answer:
          type: string
        remaining:
          type: integer
        limit:
          type: integer
        resetsAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VetSearchInput:
      type: object
      properties:
        query: { type: string, minLength: 2, maxLength: 120 }
        country: { type: string, enum: [us, ca, gb, au, anywhere], default: us }
        autoDetectCountry: { type: boolean, default: true, description: Detect postcode country only while the country selector remains at its default US choice. }
        latitude: { type: number, minimum: -85, maximum: 85 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        urgent: { type: boolean, default: false }
        openNow: { type: boolean, default: false }
        emergencyOnly: { type: boolean, default: false }
    VetClinic:
      type: object
      required: [id, name, latitude, longitude, distanceKm, address, openingStatus, emergency, sponsored]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceKm: { type: number }
        address: { type: string }
        phone: { type: string }
        website: { type: string }
        openingHours: { type: string }
        openingStatus: { type: string, enum: [open, closed, unknown] }
        emergency: { type: boolean }
        sponsored: { type: boolean }
        hasName: { type: boolean }
    VetSearchResult:
      type: object
      required: [clinics, latitude, longitude, area, urgent, source, attribution, notice, radiusKm]
      properties:
        clinics:
          type: array
          items:
            $ref: "#/components/schemas/VetClinic"
        latitude: { type: number }
        longitude: { type: number }
        area: { type: string }
        countryCode: { type: string }
        countryDetected: { type: boolean }
        geocodingSource: { type: string }
        radiusExpanded: { type: boolean }
        urgent: { type: boolean }
        source: { type: string }
        attribution: { type: string }
        notice: { type: string }
        radiusKm: { type: number }
        mapTilesUrl: { type: string }
        mapAttribution: { type: string }
    ClinicApplicationInput:
      type: object
      required: [clinicName, contactEmail, city, message, consent]
      properties:
        clinicName: { type: string, minLength: 2, maxLength: 180 }
        contactName: { type: string, maxLength: 120 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        city: { type: string, minLength: 2, maxLength: 120 }
        website: { type: string, maxLength: 2048 }
        message: { type: string, minLength: 10, maxLength: 4000 }
        intent: { type: string, enum: [claim, featured, both], default: claim }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    AdvertiserInquiryInput:
      type: object
      required: [brandName, contactEmail, message, consent]
      properties:
        brandName: { type: string, minLength: 2, maxLength: 180 }
        contactName: { type: string, maxLength: 120 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        website: { type: string, maxLength: 2048 }
        message: { type: string, minLength: 10, maxLength: 4000 }
        placements:
          type: array
          maxItems: 3
          items: { type: string, enum: [tools-guides, product-box, newsletter] }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    PromotionReceipt:
      type: object
      required: [id, message]
      properties:
        id: { type: integer }
        message: { type: string }
    ClinicApplication:
      allOf:
        - $ref: "#/components/schemas/ClinicApplicationInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
    AdvertiserInquiry:
      allOf:
        - $ref: "#/components/schemas/AdvertiserInquiryInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
    PromotionLeads:
      type: object
      required: [clinicApplications, advertiserInquiries, clinicTotal, advertiserTotal]
      properties:
        clinicApplications:
          type: array
          items:
            $ref: "#/components/schemas/ClinicApplication"
        advertiserInquiries:
          type: array
          items:
            $ref: "#/components/schemas/AdvertiserInquiry"
        clinicTotal: { type: integer }
        advertiserTotal: { type: integer }
