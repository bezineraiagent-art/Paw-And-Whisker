openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /subscribers:
    post:
      operationId: capturePdfEmail
      summary: Save an email and unlock the free symptom PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Email saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfAccess"
        "400":
          description: Invalid email
        "500":
          description: Storage unavailable
  /companion/usage:
    get:
      operationId: getCompanionUsage
      summary: Get anonymous daily chat allowance
      responses:
        "200":
          description: Current allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionUsage"
  /companion/message:
    post:
      operationId: askCompanion
      summary: Ask a general pet question within the daily allowance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionInput"
      responses:
        "200":
          description: Answer and remaining allowance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionAnswer"
        "400":
          description: Invalid question
        "429":
          description: Daily cap reached
        "503":
          description: AI unavailable
  /vets/search:
    post:
      operationId: searchVets
      summary: Find nearby clinics without persisting a visitor location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VetSearchInput"
      responses:
        "200":
          description: Distance-sorted nearby clinics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VetSearchResult"
        "400":
          description: Invalid search
        "429":
          description: Rate limited
        "503":
          description: Public map service unavailable
  /promotion/clinic-applications:
    post:
      operationId: createClinicApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicApplicationInput"
      responses:
        "201":
          description: Application saved, not published or emailed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionReceipt"
  /promotion/advertiser-inquiries:
    post:
      operationId: createAdvertiserInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertiserInquiryInput"
      responses:
        "201":
          description: Inquiry saved, no outbound messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionReceipt"
  /promotion/leads:
    get:
      operationId: getPromotionLeads
      parameters:
        - in: header
          name: x-admin-token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest 100 leads of each kind, accessible only with the existing admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionLeads"
        "401":
          description: Unauthorized
components:
  schemas:
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PdfAccess:
      type: object
      required: [success, downloadUrl]
      properties:
        success:
          type: boolean
        downloadUrl:
          type: string
    CompanionInput:
      type: object
      required: [question]
      properties:
        imageDataUrl:
          type: string
          maxLength: 4500000
          description: Optional transient JPEG, PNG or WebP, never persisted in the app database
        question:
          type: string
          minLength: 1
          maxLength: 3000
        petName:
          type: string
          maxLength: 60
        species:
          type: string
          enum: [puppy, dog, cat]
        age:
          type: string
          maxLength: 40
    CompanionUsage:
      type: object
      required: [remaining, limit, resetsAt]
      properties:
        remaining:
          type: integer
        limit:
          type: integer
        resetsAt:
          type: string
          format: date-time
    CompanionAnswer:
      type: object
      required: [answer, remaining, limit, resetsAt]
      properties:
        answer:
          type: string
        remaining:
          type: integer
        limit:
          type: integer
        resetsAt:
          type: string
          format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VetSearchInput:
      type: object
      properties:
        query: { type: string, minLength: 2, maxLength: 120 }
        latitude: { type: number, minimum: -85, maximum: 85 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        urgent: { type: boolean, default: false }
        openNow: { type: boolean, default: false }
        emergencyOnly: { type: boolean, default: false }
    VetClinic:
      type: object
      required: [id, name, latitude, longitude, distanceKm, address, openingStatus, emergency, sponsored]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        distanceKm: { type: number }
        address: { type: string }
        phone: { type: string }
        website: { type: string }
        openingHours: { type: string }
        openingStatus: { type: string, enum: [open, closed, unknown] }
        emergency: { type: boolean }
        sponsored: { type: boolean }
    VetSearchResult:
      type: object
      required: [clinics, latitude, longitude, area, urgent, source, attribution, notice, radiusKm]
      properties:
        clinics:
          type: array
          items:
            $ref: "#/components/schemas/VetClinic"
        latitude: { type: number }
        longitude: { type: number }
        area: { type: string }
        urgent: { type: boolean }
        source: { type: string }
        attribution: { type: string }
        notice: { type: string }
        radiusKm: { type: number }
        mapTilesUrl: { type: string }
        mapAttribution: { type: string }
    ClinicApplicationInput:
      type: object
      required: [clinicName, contactEmail, city, message, consent]
      properties:
        clinicName: { type: string, minLength: 2, maxLength: 180 }
        contactName: { type: string, maxLength: 120 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        city: { type: string, minLength: 2, maxLength: 120 }
        website: { type: string, maxLength: 2048 }
        message: { type: string, minLength: 10, maxLength: 4000 }
        intent: { type: string, enum: [claim, featured, both], default: claim }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    AdvertiserInquiryInput:
      type: object
      required: [brandName, contactEmail, message, consent]
      properties:
        brandName: { type: string, minLength: 2, maxLength: 180 }
        contactName: { type: string, maxLength: 120 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        website: { type: string, maxLength: 2048 }
        message: { type: string, minLength: 10, maxLength: 4000 }
        placements:
          type: array
          maxItems: 3
          items: { type: string, enum: [tools-guides, product-box, newsletter] }
        consent: { type: boolean }
        fax: { type: string, maxLength: 0 }
    PromotionReceipt:
      type: object
      required: [id, message]
      properties:
        id: { type: integer }
        message: { type: string }
    ClinicApplication:
      allOf:
        - $ref: "#/components/schemas/ClinicApplicationInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
    AdvertiserInquiry:
      allOf:
        - $ref: "#/components/schemas/AdvertiserInquiryInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer }
            createdAt: { type: string, format: date-time }
    PromotionLeads:
      type: object
      required: [clinicApplications, advertiserInquiries, clinicTotal, advertiserTotal]
      properties:
        clinicApplications:
          type: array
          items:
            $ref: "#/components/schemas/ClinicApplication"
        advertiserInquiries:
          type: array
          items:
            $ref: "#/components/schemas/AdvertiserInquiry"
        clinicTotal: { type: integer }
        advertiserTotal: { type: integer }
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
