kind = "web"
previewPath = "/"
title = "Paw and Whisker AI"
version = "1.0.0"
id = "artifacts/paw-and-whisker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21283

[services.development]
run = "pnpm --filter @workspace/paw-and-whisker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paw-and-whisker", "run", "build" ]
[services.production.run]
args = [ "node", "artifacts/paw-and-whisker/server.mjs" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "21283"

[services.env]
PORT = "21283"
BASE_PATH = "/"
