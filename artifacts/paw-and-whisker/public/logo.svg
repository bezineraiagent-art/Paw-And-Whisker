<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9a8d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="96" fill="url(#grad1)" />
  <circle cx="100" cy="100" r="90" fill="white" fill-opacity="0.12" />

  <!-- Cat ears (triangles at top) -->
  <polygon points="60,58 48,30 80,52" fill="white" opacity="0.95" />
  <polygon points="140,58 152,30 120,52" fill="white" opacity="0.95" />
  <!-- Inner ear color -->
  <polygon points="62,55 53,36 76,52" fill="url(#grad2)" opacity="0.8" />
  <polygon points="138,55 147,36 124,52" fill="url(#grad2)" opacity="0.8" />

  <!-- Cat face circle -->
  <circle cx="100" cy="108" r="52" fill="white" opacity="0.96" />

  <!-- Eyes -->
  <ellipse cx="84" cy="98" rx="7" ry="8" fill="#1e1b4b" />
  <ellipse cx="116" cy="98" rx="7" ry="8" fill="#1e1b4b" />
  <!-- Eye shine -->
  <circle cx="87" cy="95" r="2.5" fill="white" />
  <circle cx="119" cy="95" r="2.5" fill="white" />

  <!-- Nose -->
  <polygon points="100,111 96,107 104,107" fill="#f472b6" />

  <!-- Mouth -->
  <path d="M96,112 Q100,117 104,112" stroke="#d1d5db" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Whiskers left -->
  <line x1="74" y1="110" x2="50" y2="106" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="74" y1="114" x2="50" y2="114" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="74" y1="118" x2="50" y2="122" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Whiskers right -->
  <line x1="126" y1="110" x2="150" y2="106" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="126" y1="114" x2="150" y2="114" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="126" y1="118" x2="150" y2="122" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Paw print overlay (bottom right of circle) -->
  <g transform="translate(128, 136)" opacity="0.9">
    <!-- Main pad -->
    <ellipse cx="12" cy="16" rx="10" ry="8" fill="url(#grad1)" />
    <!-- Toe pads -->
    <ellipse cx="4" cy="8" rx="4.5" ry="3.5" fill="url(#grad1)" />
    <ellipse cx="12" cy="5" rx="4.5" ry="3.5" fill="url(#grad1)" />
    <ellipse cx="20" cy="8" rx="4.5" ry="3.5" fill="url(#grad1)" />
  </g>

  <!-- Sparkle dots -->
  <circle cx="36" cy="80" r="3" fill="white" opacity="0.7" />
  <circle cx="164" cy="80" r="3" fill="white" opacity="0.7" />
  <circle cx="44" cy="140" r="2" fill="white" opacity="0.5" />
  <circle cx="156" cy="140" r="2" fill="white" opacity="0.5" />
  <circle cx="100" cy="170" r="2.5" fill="white" opacity="0.6" />
</svg>
